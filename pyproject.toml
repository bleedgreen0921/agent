[project]
name = "research-agent-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.6",
  "alembic==1.15.2", "SQLAlchemy==2.0.40", "httpx==0.28.1",
  "python-multipart==0.0.20", "markdown-it-py==4.0.0", "jieba==0.42.1", "PyYAML==6.0.3",
  "transformers==4.57.3", "docling==2.65.0",
  "torch==2.6.0+cpu", "torchvision==0.21.0+cpu",
  "matplotlib==3.11.2",
  "langchain==1.4.2", "langgraph==1.2.12", "langchain-openai==1.6.4",
  "langgraph-checkpoint-postgres==3.1.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
